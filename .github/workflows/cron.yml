# Free-tier scheduler: pings /api/cron every 5 minutes.
# Repo secrets: APP_URL (https://your-app.vercel.app), CRON_SECRET
name: flowlite-cron
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron"
